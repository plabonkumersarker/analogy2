  <style>
    * {

      padding: 0;
      box-sizing: border-box;
    }

      height: 100vh;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e5e5e5;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Search Screen */
    .search-screen {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.3s ease;
    }

    .search-screen.hidden {
      display: none;
    }

    .search-title {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .search-subtitle {
      font-size: 0.875rem;
      color: #737373;
      margin-bottom: 32px;
    }

    .search-box {
      width: 100%;
      max-width: 280px;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.25rem;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 12px;
      color: #e5e5e5;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: #404040;
      background: #1a1a1a;
    }

    .search-hint {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #525252;
      text-align: center;
    }

    /* Card Screen */
    .card-screen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .card-screen.active {
      display: flex;
    }

    .card-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #262626;
    }

    .back-btn {
      font-size: 0.875rem;
      color: #737373;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      color: #e5e5e5;
      background: #1a1a1a;
    }

    .counter {
      font-size: 0.875rem;
      color: #737373;
      font-family: monospace;
    }

    .card-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .card-content {
      text-align: center;
      max-width: 90%;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .cite-badge {
      font-size: 0.875rem;
      color: #525252;
      font-family: monospace;
      margin-bottom: 24px;
      display: inline-block;
      padding: 6px 12px;
      background: #141414;
      border-radius: 20px;
      border: 1px solid #262626;
    }

    .cite-badge.other {
      color: #a3a3a3;
      border-color: #404040;
    }

    .analogy-pair {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .analogy-pair .word {
      color: #e5e5e5;
    }

    .analogy-pair .colon {
      color: #525252;
      margin: 0 8px;
    }

    .relation {
      font-size: 1.125rem;
      color: #a3a3a3;
      margin-bottom: 32px;
      line-height: 1.4;
    }

    .answer-section {
      padding-top: 24px;
      border-top: 1px solid #262626;
    }

    .answer-label {
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #22c55e;
      margin-bottom: 12px;
    }

    .answer-pair {
      font-size: 1.5rem;
      font-weight: 500;
      color: #22c55e;
    }

    .answer-pair .word {
      background: rgba(34, 197, 94, 0.08);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #166534;
    }

    .swipe-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #404040;
      text-align: center;
    }

    /* Animations */
    .slide-out-left { transform: translateX(-100px); opacity: 0; }
    .slide-out-right { transform: translateX(100px); opacity: 0; }
    .slide-out-up { transform: translateY(-80px); opacity: 0; }
    .slide-out-down { transform: translateY(80px); opacity: 0; }
    .slide-in-left { transform: translateX(-100px); opacity: 0; }
    .slide-in-right { transform: translateX(100px); opacity: 0; }
    .slide-in-up { transform: translateY(-80px); opacity: 0; }
    .slide-in-down { transform: translateY(80px); opacity: 0; }

    /* Responsive */
    @media (max-width: 480px) {
      .search-title { font-size: 2rem; }
      .analogy-pair { font-size: 1.625rem; }
      .relation { font-size: 1rem; }
      .answer-pair { font-size: 1.25rem; }
    }

    @media (max-height: 700px) {
      .analogy-pair { font-size: 1.5rem; }
      .relation { font-size: 0.9375rem; margin-bottom: 20px; }
      .answer-pair { font-size: 1.125rem; }
    }
  </style>
</head>

    let filteredData = [];
    let currentIndex = 0;

    const searchScreen = document.getElementById('searchScreen');
    const cardScreen = document.getElementById('cardScreen');
    const searchInput = document.getElementById('searchInput');
    const cardContent = document.getElementById('cardContent');

    function isNumericCite(cite) {
      return /^\d+-\d+$/.test(cite);
    }

    function getCitePrefix(cite) {
      const match = cite.match(/^(\d+)-/);
      return match ? match[1].padStart(2, '0') : null;
    }

    function splitPair(str) {
      return str.split(':');
    }

    function performSearch() {
      const search = searchInput.value.trim().toLowerCase();
      
      if (!search) return;

      if (search === 'other') {
        filteredData = analogyData.filter(item => !isNumericCite(item.cite));
      } else {
        const num = parseInt(search);
        if (!isNaN(num)) {
          const prefix = num.toString().padStart(2, '0');
          filteredData = analogyData.filter(item => getCitePrefix(item.cite) === prefix);
        } else {
          filteredData = analogyData.filter(item => 
            item.cite.toLowerCase().includes(search) ||
            item.analogy.toLowerCase().includes(search)
          );
        }
      }

      if (filteredData.length > 0) {
        currentIndex = 0;
        showCardScreen();
        renderCard();
      } else {
        searchInput.style.borderColor = '#ef4444';
        setTimeout(() => searchInput.style.borderColor = '', 300);
      }
    }

    // Search only on Enter key
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        performSearch();
      }
    });

    function showCardScreen() {
      searchScreen.classList.add('hidden');
      cardScreen.classList.add('active');
    }

    function showSearch() {
      searchScreen.classList.remove('hidden');
      cardScreen.classList.remove('active');
      searchInput.value = '';
      searchInput.focus();
      filteredData = [];
    }

    function renderCard(animOut, animIn) {
      const item = filteredData[currentIndex];
      const [a1, a2] = splitPair(item.analogy);
      const [ans1, ans2] = splitPair(item.answer);
      const isOther = !isNumericCite(item.cite);

      if (animOut) {
        cardContent.classList.add(animOut);
      }

      setTimeout(() => {
        document.getElementById('citeBadge').textContent = item.cite;
        document.getElementById('citeBadge').className = 'cite-badge ' + (isOther ? 'other' : '');
        document.getElementById('analogyPair').innerHTML = 
          `<span class="word">${a1}</span><span class="colon">:</span><span class="word">${a2}</span>`;
        document.getElementById('relation').textContent = item.relation;
        document.getElementById('answerPair').innerHTML = 
          `<span class="word">${ans1}</span><span class="colon">:</span><span class="word">${ans2}</span>`;
        document.getElementById('counter').textContent = `${currentIndex + 1} / ${filteredData.length}`;

        cardContent.className = 'card-content';
        if (animIn) {
          cardContent.classList.add(animIn);
          setTimeout(() => cardContent.className = 'card-content', 30);
        }
      }, animOut ? 250 : 0);
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % filteredData.length;
      renderCard('slide-out-up', 'slide-in-down');
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;
      renderCard('slide-out-down', 'slide-in-up');
    }

    function nextCardHorizontal() {
      currentIndex = (currentIndex + 1) % filteredData.length;
      renderCard('slide-out-left', 'slide-in-right');
    }

    function prevCardHorizontal() {
      currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;
      renderCard('slide-out-right', 'slide-in-left');
    }

    // Click navigation
    const cardContainer = document.getElementById('cardContainer');
    
    cardContainer.addEventListener('click', (e) => {
      const midX = window.innerWidth / 2;
      const midY = window.innerHeight / 2;
      const x = e.clientX;
      const y = e.clientY;

      const diffX = x - midX;
      const diffY = y - midY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 0) nextCardHorizontal();
        else prevCardHorizontal();
      } else {
        if (diffY > 0) nextCard();
        else prevCard();
      }
    });

    // Touch support
    let touchStartX = 0;
    let touchStartY = 0;

    cardContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    });

    cardContainer.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.max(Math.abs(diffX), Math.abs(diffY)) < 50) return;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 0) prevCardHorizontal();
        else nextCardHorizontal();
      } else {
        if (diffY > 0) prevCard();
        else nextCard();
      }
    });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (!cardScreen.classList.contains('active')) return;
      
      switch(e.key) {
        case 'ArrowRight': nextCardHorizontal(); break;
        case 'ArrowLeft': prevCardHorizontal(); break;
        case 'ArrowDown': nextCard(); break;
        case 'ArrowUp': prevCard(); break;
        case ' ': e.preventDefault(); nextCard(); break;
        case 'Escape': showSearch(); break;
      }
    });

    // Mouse wheel
    let wheelTimeout = null;
    cardContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      clearTimeout(wheelTimeout);
      
      wheelTimeout = setTimeout(() => {
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
          if (e.deltaX > 0) nextCardHorizontal();
          else prevCardHorizontal();
        } else {
          if (e.deltaY > 0) nextCard();
          else prevCard();
        }
      }, 50);
    }, { passive: false });

    searchInput.focus();
  </script>
</body>
</html>
